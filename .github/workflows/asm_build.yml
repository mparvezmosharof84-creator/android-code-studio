name: Build Android Code Studio

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      # ১. আগের মালিকের সব আপডেট লিঙ্ক ও রিমোট ইউআরএল চিরতরে ধ্বংস করা
      - name: Erase All Update Checkers & Original Links
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's#https://raw.githubusercontent.com/AndroidCSOfficial.*#""#g' {} + || true
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's#https://api.github.com/repos/AndroidCSOfficial.*#""#g' {} + || true
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's#t.me/rv2ide#t.me/#g' {} + || true
          sed -i '/TERMUX_PACKAGE_NAME/s/com.androidai.studio/com.tom.rv2ide/g' termux/shared/src/main/java/com/termux/shared/termux/TermuxConstants.java || true

      - name: Create Missing Directories
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies

      - name: Build Debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          find core/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      # সরাসরি আসল রঅ APK রিলিজ করা
      - name: Release Direct APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "Android AI Studio v1.0.0"
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
