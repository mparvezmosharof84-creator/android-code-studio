name: Build Android Code Studio

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      # Termux ও idesetup স্ক্রিপ্টের সব পাথ নতুন প্যাকেজ নামে আপডেট করা
      - name: Fix Termux & IDESetup Paths
        run: |
          sed -i '/TERMUX_PACKAGE_NAME/s/com.tom.rv2ide/com.androidai.studio/g' termux/shared/src/main/java/com/termux/shared/termux/TermuxConstants.java
          grep -rl "/data/data/com.tom.rv2ide" . | xargs sed -i 's#/data/data/com.tom.rv2ide#/data/data/com.androidai.studio#g' || true
          grep -rl "/data/user/0/com.tom.rv2ide" . | xargs sed -i 's#/data/user/0/com.tom.rv2ide#/data/user/0/com.androidai.studio#g' || true

      - name: Create Missing Directories
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies

      - name: Build Debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          find core/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      # সরাসরি রঅ APK রিলিজ করা
      - name: Release Direct APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ github.run_number }}"
          name: "Android AI Studio v1.0.0"
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
