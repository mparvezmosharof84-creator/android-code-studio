name: Build Android Code Studio

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Create Missing Directories
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies

      - name: Build Debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          find core/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      # সম্পূর্ণ নতুন স্পষ্ট নামে রিলিজ তৈরি করা যাতে পুরনো APK-র সাথে কোনো বিভ্রান্তি না হয়
      - name: Release Direct APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.0-FINAL-${{ github.run_number }}"
          name: "Android AI Studio v2.0.0 (Crash Fixed)"
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
